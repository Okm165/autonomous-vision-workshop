[project]
name = "autonomus"
version = "0.1.0"
description = "Vision, 3D Mapping & Autonomous Flight Workshop: 24 notebooks covering the full stack from radiometry to neural SLAM to autonomous drone navigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "tqdm>=4.65",
    "open3d>=0.17",
    "numba>=0.58",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    "kornia>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
